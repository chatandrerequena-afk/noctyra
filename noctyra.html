<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOCTYRA</title>
<style>
:root{--bg:#030605;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--txt:#eefdf6;--mut:#9fd8bf;--acc:#58ffc0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,#113128,#030605 65%);min-height:100vh;color:var(--txt);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:28px 28px;opacity:.15;pointer-events:none}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.55));pointer-events:none}
.glow,.glow2{position:fixed;border-radius:50%;filter:blur(90px);opacity:.22;animation:float 16s ease-in-out infinite alternate}.glow{width:320px;height:320px;background:#39ffb0;top:-120px;left:-80px}.glow2{width:260px;height:260px;background:#fff;bottom:-80px;right:-60px;animation-duration:20s}@keyframes float{to{transform:translate(180px,120px) scale(1.25)}}
.wrap{max-width:900px;margin:auto;padding:28px}.glass{position:relative;overflow:hidden;background:var(--glass);backdrop-filter:blur(28px) saturate(180%) brightness(1.1);border:1px solid var(--line);border-radius:32px;box-shadow:0 20px 80px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.28);padding:28px}
.glass:before{content:"";position:absolute;inset:-40%;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.26) 50%,transparent 65%);transform:translateX(-120%) rotate(8deg);animation:shine 12s linear infinite}@keyframes shine{to{transform:translateX(120%) rotate(8deg)}}.glass:after{content:"";position:absolute;left:8%;right:8%;top:0;height:90px;background:radial-gradient(ellipse at center,rgba(255,255,255,.18),transparent 70%);filter:blur(18px)}
h1{text-align:center;font-size:56px;letter-spacing:8px;color:var(--acc);margin:0}.sub{text-align:center;color:var(--mut);letter-spacing:3px;margin:8px 0 20px}.quote{padding:14px;background:rgba(255,255,255,.04);border-left:2px solid var(--acc);border-radius:12px;color:#d9fff0;font-size:13px}
label{display:block;margin:16px 0 8px;color:#aaf5d5;font-size:13px;letter-spacing:1px}input,textarea{width:100%;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px rgba(255,255,255,.10),inset 0 -8px 20px rgba(0,0,0,.18);backdrop-filter:blur(12px);color:#fff;padding:14px;border-radius:18px;outline:none}textarea{min-height:180px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.btn{position:relative;overflow:hidden;border:none;border-radius:18px;padding:15px;background:rgba(255,255,255,.08);backdrop-filter:blur(18px);color:#dffff4;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.35s}.btn:before{content:"";position:absolute;width:220%;height:220%;left:-60%;top:-80%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 55%);animation:liquid 8s linear infinite}@keyframes liquid{to{transform:rotate(360deg)}}.btn:hover{transform:translateY(-2px) scale(1.02);background:rgba(88,255,192,.18);box-shadow:0 0 24px rgba(88,255,192,.18)}
.stat{margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);color:#8ff0c8;font-size:13px}footer{margin-top:18px;text-align:center;color:#8dbba7;font-size:12px}
@media(max-width:700px){.row{grid-template-columns:1fr}h1{font-size:42px}}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="wrap"><div class="glass">
<h1>NOCTYRA</h1><div class="sub">PRIVATE ENCRYPTION TERMINAL</div>
<div class="quote">Inspirado en KRYPTOS con estética Liquid Glass. Todo el cifrado ocurre localmente con AES‑256‑GCM y PBKDF2.</div>
<label>ACCESS KEY</label><input id="pass" type="password" placeholder="ENTER PASSPHRASE">
<label>MESSAGE / ENCRYPTED BLOCK</label><textarea id="input" placeholder="WRITE OR PASTE TEXT..."></textarea>
<div class="row"><button class="btn" onclick="encrypt()">ENCRYPT</button><button class="btn" onclick="decrypt()">DECRYPT</button><button class="btn" onclick="copyResult()">COPY</button><button class="btn" onclick="clearAll()">CLEAR</button></div>
<label>RESULT</label><textarea id="output" readonly></textarea>
<div class="stat" id="status">● SECURE LOCAL SESSION READY</div>
<footer>FORMAT NXK742Q9 · AES‑256‑GCM · PBKDF2 SHA‑256 · 250000 ITERATIONS · OFFLINE</footer>
</div></div>
<script>
const enc=new TextEncoder(),dec=new TextDecoder(),A="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
const b32=b=>{let bits=0,v=0,o="";for(const x of b){v=(v<<8)|x;bits+=8;while(bits>=5){o+=A[(v>>(bits-5))&31];bits-=5}}if(bits)o+=A[(v<<(5-bits))&31];return o}
const ub32=s=>{s=s.replace(/[^A-Z2-7]/g,"");let bits=0,v=0,o=[];for(const c of s){const i=A.indexOf(c);if(i<0)continue;v=(v<<5)|i;bits+=5;if(bits>=8){o.push((v>>(bits-8))&255);bits-=8}}return new Uint8Array(o)}
async function derive(p,s){const km=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",0,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},0,["encrypt","decrypt"])}
async function encrypt(){try{if(!pass.value||!input.value)throw"ENTER PASSWORD AND MESSAGE";status.textContent="GENERATING SECURE BLOCK...";const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await derive(pass.value,salt),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(input.value)));output.value=`NXK742Q9\n${b32(salt)}\n${b32(iv)}\n${b32(ct)}`;status.textContent="✔ ENCRYPTION COMPLETE"}catch(e){status.textContent=e}}
async function decrypt(){try{const l=input.value.trim().split(/\n/);if(l.length!==4||l[0]!=="NXK742Q9")throw 0;status.textContent="VERIFYING AUTHENTICITY...";const k=await derive(pass.value,ub32(l[1]));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub32(l[2])},k,ub32(l[3]));output.value=dec.decode(pt);status.textContent="✔ MESSAGE VERIFIED"}catch{output.value="";status.textContent="ACCESS DENIED — INVALID KEY OR CORRUPTED DATA"}}
copyResult=()=>navigator.clipboard.writeText(output.value).then(()=>status.textContent="RESULT COPIED");clearAll=()=>{pass.value=input.value=output.value="";status.textContent="● SECURE LOCAL SESSION READY"}
</script></body></html>
